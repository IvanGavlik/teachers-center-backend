<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True or False</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 20px 10px;
      background: rgba(0,0,0,0.25);
      gap: 4px;
    }
    .quiz-title {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .counter {
      font-size: 15px;
      font-weight: 700;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* ── Progress bar ── */
    .progress-wrap { height: 6px; background: rgba(255,255,255,0.12); }
    .progress-fill { height: 100%; background: #f0d800; transition: width 0.4s ease; }

    /* ── Question card ── */
    .game-body {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 0 16px;
    }
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .question-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0 16px;
    }
    .question-card {
      background: white;
      color: #1a1a2e;
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 700px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .question-text {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
    }

    /* ── Explanation ── */
    .explanation-wrap {
      max-width: 740px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: none;
    }
    .explanation-wrap.show { display: block; margin-bottom: 12px; }
    .explanation-inner {
      background: rgba(255,255,255,0.08);
      border-left: 4px solid #f0d800;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Answer grid (True / False) ── */
    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 16px 12px;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
    }
    .answer-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 26px 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      color: white;
      min-height: 84px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s, filter 0.15s;
    }
    .answer-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .answer-btn:hover:not(:disabled)  { filter: brightness(1.12); }
    .answer-btn:disabled              { cursor: default; }

    .answer-btn.true-btn  { background: #26890c; }
    .answer-btn.false-btn { background: #e21b3c; }

    .answer-btn.dimmed  { filter: brightness(0.35) !important; }
    .answer-btn.correct { outline: 4px solid white; filter: brightness(1.15) !important; }
    .answer-btn.wrong   { filter: brightness(0.35) !important; outline: 4px solid rgba(255,255,255,0.3); }

    .shape { font-size: 22px; flex-shrink: 0; }

    /* ── Next button ── */
    .next-wrap { text-align: center; padding: 4px 16px 24px; display: none; }
    .next-wrap.show { display: block; }
    .next-btn {
      background: #f0d800;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      padding: 16px 52px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8a200;
      transition: transform 0.1s;
      letter-spacing: 0.3px;
    }
    .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8a200; }

    /* ── Results screen ── */
    .results {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }
    .results.show { display: flex; }

    .results-emoji  { font-size: 72px; margin-bottom: 16px; }
    .results-score  { font-size: 80px; font-weight: 800; color: #f0d800; line-height: 1; margin-bottom: 8px; }
    .results-label  { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .results-sub    { font-size: 16px; opacity: 0.65; margin-bottom: 36px; }

    .restart-btn {
      background: #f0d800;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8a200;
    }

    /* ── Name entry ── */
    .name-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }
    .name-entry.hide { display: none; }
    .name-input {
      margin: 20px 0 28px;
      padding: 16px 18px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    /* ── Live scores sidebar ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 14px;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.6;
      text-align: center;
      margin-bottom: 2px;
    }
    .sidebar-empty { font-size: 13px; opacity: 0.5; font-style: italic; text-align: center; }
    .sidebar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .sidebar-row.me { background: #f0d800; color: #1a1a2e; font-weight: 800; }
    .sidebar-rank   { width: 20px; flex-shrink: 0; font-weight: 800; opacity: 0.6; text-align: center; }
    .sidebar-row.me .sidebar-rank { opacity: 1; }
    .sidebar-name   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .sidebar-score  { flex-shrink: 0; opacity: 0.75; }
    .sidebar-row.me .sidebar-score { opacity: 1; }

    /* ── Podium ── */
    .podium-title {
      display: none;
      font-size: 13px;
      font-weight: 800;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 28px;
    }
    .podium-col   { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .podium-medal { font-size: 24px; }
    .podium-name  { font-size: 12px; font-weight: 700; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-score { font-size: 11px; opacity: 0.7; }
    .podium-bar   { width: 100%; border-radius: 8px 8px 0 0; background: rgba(255,255,255,0.15); }
    .podium-col.rank-1 .podium-bar { height: 64px; background: #f0d800; }
    .podium-col.rank-2 .podium-bar { height: 46px; }
    .podium-col.rank-3 .podium-bar { height: 34px; }
    .podium-col.me .podium-name    { color: #f0d800; }

    @media (max-width: 480px) {
      .question-text { font-size: 18px; }
      .answer-btn    { font-size: 16px; min-height: 68px; padding: 20px 10px; }
      .answers       { gap: 8px; padding: 0 10px 10px; }

      .game-body     { flex-direction: column; gap: 10px; }
      .sidebar       { width: 100%; max-height: 130px; padding: 10px 12px; }
      .sidebar-title { font-size: 11px; }
      .sidebar-row   { font-size: 11px; padding: 6px 8px; gap: 5px; }
    }
  </style>
</head>
<body>

<div class="name-entry" id="name-entry">
  <div class="results-emoji">✍️</div>
  <div class="results-label">Enter your name to begin</div>
  <input class="name-input" id="name-input" type="text" placeholder="Your name" maxlength="40" autofocus>
  <button class="restart-btn" onclick="startGame()">Start</button>
</div>

<div id="game" style="display:none">
  <div class="header">
    <span class="quiz-title" id="quiz-title"></span>
    <span class="counter" id="counter"></span>
  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>

  <div class="game-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title">🏆 Scores</div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">No scores yet</div>
      </div>
    </div>

    <div class="main-column">
      <div class="question-area">
        <div class="question-card">
          <div class="question-text" id="question-text"></div>
        </div>
      </div>

      <div class="explanation-wrap" id="explanation-wrap">
        <div class="explanation-inner" id="explanation-text"></div>
      </div>

      <div class="answers" id="answers">
        <button class="answer-btn true-btn" id="true-btn" onclick="pick(true)">
          <span class="shape">✓</span> True
        </button>
        <button class="answer-btn false-btn" id="false-btn" onclick="pick(false)">
          <span class="shape">✗</span> False
        </button>
      </div>

      <div class="next-wrap" id="next-wrap">
        <button class="next-btn" onclick="next()">Next →</button>
      </div>
    </div>
  </div>
</div>

<div class="results" id="results">
  <div class="results-emoji" id="results-emoji"></div>
  <div class="results-score" id="results-score"></div>
  <div class="results-label" id="results-label"></div>
  <div class="results-sub"   id="results-sub"></div>

  <div class="podium-title" id="podium-title">🏆 Class Leaderboard</div>
  <div class="podium" id="podium"></div>

  <button class="restart-btn" onclick="restart()">Play Again</button>
</div>

<script>
  var QUIZ         = {{QUIZ_DATA}};
  var questions    = QUIZ.questions;
  var total        = questions.length;
  var idx          = 0;
  var score        = 0;
  var studentName  = '';
  var SESSION_ID   = 'me';
  var leaderboard  = {}; // sessionId -> {name, score, total} — local to this browser only

  function renderLeaderboard() {
    var entries = Object.keys(leaderboard).map(function(sessionId) {
      return { sessionId: sessionId, result: leaderboard[sessionId] };
    });
    entries.sort(function(a, b) { return b.result.score - a.result.score; });

    renderSidebar(entries);
    renderPodium(entries);
  }

  function renderSidebar(entries) {
    var el = document.getElementById('sidebar-list');

    if (entries.length === 0) {
      el.innerHTML = '<div class="sidebar-empty">No scores yet</div>';
      return;
    }

    var medals = ['🥇', '🥈', '🥉'];
    el.innerHTML = entries.map(function(entry, i) {
      var mine = entry.sessionId === SESSION_ID;
      var rank = medals[i] || (i + 1);
      return '<div class="sidebar-row' + (mine ? ' me' : '') + '">' +
        '<span class="sidebar-rank">' + rank + '</span>' +
        '<span class="sidebar-name">' + escapeHtml(entry.result.name) + '</span>' +
        '<span class="sidebar-score">' + entry.result.score + '/' + entry.result.total + '</span>' +
        '</div>';
    }).join('');
  }

  function renderPodium(entries) {
    var podiumEl = document.getElementById('podium');
    var titleEl  = document.getElementById('podium-title');
    var top3     = entries.slice(0, 3);

    if (top3.length === 0) {
      podiumEl.innerHTML  = '';
      titleEl.style.display = 'none';
      return;
    }
    titleEl.style.display = '';

    var medals = ['🥇', '🥈', '🥉'];
    var visualOrder = [1, 0, 2]; // 2nd, 1st, 3rd — classic podium arrangement

    podiumEl.innerHTML = visualOrder
      .filter(function(i) { return top3[i]; })
      .map(function(i) {
        var entry = top3[i];
        var mine  = entry.sessionId === SESSION_ID;
        return '<div class="podium-col rank-' + (i + 1) + (mine ? ' me' : '') + '">' +
          '<span class="podium-medal">' + medals[i] + '</span>' +
          '<span class="podium-name">' + escapeHtml(entry.result.name) + '</span>' +
          '<span class="podium-score">' + entry.result.score + '/' + entry.result.total + '</span>' +
          '<div class="podium-bar"></div>' +
          '</div>';
      }).join('');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.title = QUIZ.title || 'True or False';
  document.getElementById('quiz-title').textContent = QUIZ.title || '';

  function startGame() {
    var name = document.getElementById('name-input').value.trim();
    if (!name) return;
    studentName = name;
    document.getElementById('name-entry').className = 'name-entry hide';
    document.getElementById('game').style.display = '';
    render();
  }

  function render() {
    var q = questions[idx];

    document.getElementById('counter').textContent      = 'Statement ' + (idx + 1) + ' of ' + total;
    document.getElementById('progress').style.width     = (idx / total * 100) + '%';
    document.getElementById('question-text').textContent = q.statement;
    document.getElementById('explanation-wrap').className = 'explanation-wrap';
    document.getElementById('explanation-text').textContent = '';
    document.getElementById('next-wrap').className      = 'next-wrap';

    ['true-btn', 'false-btn'].forEach(function(id) {
      var btn = document.getElementById(id);
      btn.disabled = false;
      btn.classList.remove('dimmed', 'correct', 'wrong');
    });
  }

  function pick(sel) {
    var q       = questions[idx];
    var correct = q.answer === true;
    var trueBtn  = document.getElementById('true-btn');
    var falseBtn = document.getElementById('false-btn');

    trueBtn.disabled  = true;
    falseBtn.disabled = true;

    var correctBtn = correct ? trueBtn : falseBtn;
    var wrongBtn   = correct ? falseBtn : trueBtn;

    if (sel === correct) {
      score++;
      correctBtn.classList.add('correct');
      wrongBtn.classList.add('dimmed');
    } else {
      wrongBtn.classList.add('wrong');
      correctBtn.classList.add('correct');

      document.getElementById('explanation-text').textContent = q.explanation;
      document.getElementById('explanation-wrap').className   = 'explanation-wrap show';
    }

    document.getElementById('next-wrap').className = 'next-wrap show';
  }

  function next() {
    idx++;
    if (idx < total) { render(); } else { showResults(); }
  }

  function showResults() {
    document.getElementById('game').style.display   = 'none';
    document.getElementById('progress').style.width = '100%';

    var pct = Math.round(score / total * 100);
    document.getElementById('results-score').textContent = pct + '%';
    document.getElementById('results-sub').textContent   = score + ' out of ' + total + ' correct';

    var emoji, label;
    if      (pct === 100) { emoji = '🏆'; label = 'Perfect score!';    }
    else if (pct >= 80)   { emoji = '🎉'; label = 'Excellent work!';   }
    else if (pct >= 60)   { emoji = '👍'; label = 'Good job!';         }
    else if (pct >= 40)   { emoji = '📚'; label = 'Keep practicing!';  }
    else                  { emoji = '💪'; label = "Don't give up!";     }

    document.getElementById('results-emoji').textContent = emoji;
    document.getElementById('results-label').textContent = label;
    document.getElementById('results').className         = 'results show';

    leaderboard[SESSION_ID] = { name: studentName, score: score, total: total };
    renderLeaderboard();
  }

  function restart() {
    idx   = 0;
    score = 0;
    document.getElementById('game').style.display = '';
    document.getElementById('results').className  = 'results';
    render();
  }
</script>
</body>
</html>
