<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentence Ordering</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    }

    /* ── Header ── */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 20px 10px;
      background: rgba(0,0,0,0.25);
      gap: 4px;
    }
    .quiz-title {
      font-size: 13px;
      font-weight: 700;
      opacity: 0.55;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .counter {
      font-size: 15px;
      font-weight: 700;
      opacity: 0.85;
      letter-spacing: 0.5px;
    }

    /* ── Progress bar ── */
    .progress-wrap { height: 6px; background: rgba(255,255,255,0.12); }
    .progress-fill { height: 100%; background: #f0d800; transition: width 0.4s ease; }

    /* ── Game body ── */
    .game-body {
      flex: 1;
      display: flex;
      gap: 16px;
      padding: 0 16px;
    }
    .main-column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .instruction-area {
      padding: 24px 0 12px;
      text-align: center;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
    }
    .instruction-text {
      font-size: 15px;
      font-weight: 700;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Answer row ── */
    .answer-row {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px;
      min-height: 64px;
      padding: 14px;
      background: white;
      border-radius: 14px;
      max-width: 740px;
      margin: 0 auto 16px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      transition: outline 0.15s, background 0.15s;
    }
    .answer-row.empty::before {
      content: 'Tap the words below to build the sentence';
      color: #9aa0ac;
      font-size: 14px;
      font-weight: 600;
      align-self: center;
    }
    .answer-row.correct { outline: 4px solid #26890c; background: #eafcea; }
    .answer-row.wrong   { outline: 4px solid #e21b3c; background: #fdeaec; }

    /* ── Explanation (wrong answer only) ── */
    .explanation-wrap {
      max-width: 740px;
      width: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: none;
    }
    .explanation-wrap.show { display: block; margin-bottom: 12px; }
    .explanation-inner {
      background: rgba(255,255,255,0.08);
      border-left: 4px solid #f0d800;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Word bank ── */
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 16px 12px;
      max-width: 740px;
      margin: 0 auto;
      width: 100%;
      min-height: 52px;
    }
    .word-chip {
      display: inline-flex;
      align-items: center;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      color: white;
      background: #1368ce;
      user-select: none;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s, filter 0.15s, opacity 0.15s;
    }
    .word-chip:active:not(.disabled) { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .word-chip:hover:not(.disabled)  { filter: brightness(1.12); }
    .word-chip.placed { background: #26890c; }
    .word-chip.disabled { cursor: default; opacity: 0.55; }

    /* ── Check / Next buttons ── */
    .action-wrap { text-align: center; padding: 4px 16px 24px; }
    .check-btn, .next-btn {
      background: #f0d800;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      padding: 16px 52px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8a200;
      transition: transform 0.1s, opacity 0.15s;
      letter-spacing: 0.3px;
    }
    .check-btn:active, .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8a200; }
    .check-btn:disabled { opacity: 0.4; cursor: default; box-shadow: none; }
    .next-btn { display: none; }
    .next-btn.show { display: inline-block; }

    /* ── Results screen ── */
    .results {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }
    .results.show { display: flex; }

    .results-emoji  { font-size: 72px; margin-bottom: 16px; }
    .results-score  { font-size: 80px; font-weight: 800; color: #f0d800; line-height: 1; margin-bottom: 8px; }
    .results-label  { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .results-sub    { font-size: 16px; opacity: 0.65; margin-bottom: 36px; }

    .restart-btn {
      background: #f0d800;
      color: #1a1a2e;
      border: none;
      border-radius: 12px;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #b8a200;
    }

    /* ── Name entry ── */
    .name-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 20px;
      text-align: center;
    }
    .name-entry.hide { display: none; }
    .name-input {
      margin: 20px 0 28px;
      padding: 16px 18px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    /* ── Live scores sidebar (inside the game, beside the question) ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 14px;
      background: rgba(0,0,0,0.25);
      border-radius: 16px;
      overflow-y: auto;
    }
    .sidebar-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.6;
      text-align: center;
      margin-bottom: 2px;
    }
    .sidebar-empty { font-size: 13px; opacity: 0.5; font-style: italic; text-align: center; }
    .sidebar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 13px;
    }
    .sidebar-row.me { background: #f0d800; color: #1a1a2e; font-weight: 800; }
    .sidebar-rank   { width: 20px; flex-shrink: 0; font-weight: 800; opacity: 0.6; text-align: center; }
    .sidebar-row.me .sidebar-rank { opacity: 1; }
    .sidebar-name   { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .sidebar-score  { flex-shrink: 0; opacity: 0.75; }
    .sidebar-row.me .sidebar-score { opacity: 1; }

    /* ── Podium (shown on results screen) ── */
    .podium-title {
      display: none;
      font-size: 13px;
      font-weight: 800;
      opacity: 0.65;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin-bottom: 28px;
    }
    .podium-col   { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
    .podium-medal { font-size: 24px; }
    .podium-name  { font-size: 12px; font-weight: 700; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .podium-score { font-size: 11px; opacity: 0.7; }
    .podium-bar   { width: 100%; border-radius: 8px 8px 0 0; background: rgba(255,255,255,0.15); }
    .podium-col.rank-1 .podium-bar { height: 64px; background: #f0d800; }
    .podium-col.rank-2 .podium-bar { height: 46px; }
    .podium-col.rank-3 .podium-bar { height: 34px; }
    .podium-col.me .podium-name    { color: #f0d800; }

    @media (max-width: 480px) {
      .word-chip    { font-size: 13px; padding: 10px 14px; }
      .answer-row   { padding: 10px; gap: 6px; }
      .word-bank    { gap: 6px; padding: 0 10px 10px; }

      .game-body     { flex-direction: column; gap: 10px; }
      .sidebar       { width: 100%; max-height: 130px; padding: 10px 12px; }
      .sidebar-title { font-size: 11px; }
      .sidebar-row   { font-size: 11px; padding: 6px 8px; gap: 5px; }
    }
  </style>
</head>
<body>

<div class="name-entry" id="name-entry">
  <div class="results-emoji">✍️</div>
  <div class="results-label">Enter your name to begin</div>
  <input class="name-input" id="name-input" type="text" placeholder="Your name" maxlength="40" autofocus>
  <button class="restart-btn" onclick="startGame()">Start</button>
</div>

<div id="game" style="display:none">
  <div class="header">
    <span class="quiz-title" id="quiz-title"></span>
    <span class="counter" id="counter"></span>
  </div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progress" style="width:0%"></div>
  </div>

  <div class="game-body">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-title">🏆 Scores</div>
      <div class="sidebar-list" id="sidebar-list">
        <div class="sidebar-empty">No scores yet</div>
      </div>
    </div>

    <div class="main-column">
      <div class="instruction-area">
        <div class="instruction-text">Arrange the words in the correct order</div>
      </div>

      <div class="answer-row empty" id="answer-row"></div>

      <div class="explanation-wrap" id="explanation-wrap">
        <div class="explanation-inner" id="explanation-text"></div>
      </div>

      <div class="word-bank" id="word-bank"></div>

      <div class="action-wrap">
        <button class="check-btn" id="check-btn" onclick="checkAnswer()" disabled>Check</button>
        <button class="next-btn" id="next-btn" onclick="next()">Next →</button>
      </div>
    </div>
  </div>
</div>

<div class="results" id="results">
  <div class="results-emoji" id="results-emoji"></div>
  <div class="results-score" id="results-score"></div>
  <div class="results-label" id="results-label"></div>
  <div class="results-sub"   id="results-sub"></div>

  <div class="podium-title" id="podium-title">🏆 Class Leaderboard</div>
  <div class="podium" id="podium"></div>

  <button class="restart-btn" onclick="restart()">Play Again</button>
</div>

<script>
  var QUIZ         = {{QUIZ_DATA}};
  var questions    = QUIZ.questions;
  var total        = questions.length;
  var idx          = 0;
  var score        = 0;
  var studentName  = '';
  var SESSION_ID   = 'me';
  var leaderboard  = {}; // sessionId -> {name, score, total} — local to this browser only

  var bank    = [];  // {word, origIndex}[] remaining in the word bank
  var placed  = [];  // {word, origIndex}[] placed into the answer row, in order
  var answered = false;

  function renderLeaderboard() {
    var entries = Object.keys(leaderboard).map(function(sessionId) {
      return { sessionId: sessionId, result: leaderboard[sessionId] };
    });
    entries.sort(function(a, b) { return b.result.score - a.result.score; });

    renderSidebar(entries);
    renderPodium(entries);
  }

  function renderSidebar(entries) {
    var el = document.getElementById('sidebar-list');

    if (entries.length === 0) {
      el.innerHTML = '<div class="sidebar-empty">No scores yet</div>';
      return;
    }

    var medals = ['🥇', '🥈', '🥉'];
    el.innerHTML = entries.map(function(entry, i) {
      var mine = entry.sessionId === SESSION_ID;
      var rank = medals[i] || (i + 1);
      return '<div class="sidebar-row' + (mine ? ' me' : '') + '">' +
        '<span class="sidebar-rank">' + rank + '</span>' +
        '<span class="sidebar-name">' + escapeHtml(entry.result.name) + '</span>' +
        '<span class="sidebar-score">' + entry.result.score + '/' + entry.result.total + '</span>' +
        '</div>';
    }).join('');
  }

  function renderPodium(entries) {
    var podiumEl = document.getElementById('podium');
    var titleEl  = document.getElementById('podium-title');
    var top3     = entries.slice(0, 3);

    if (top3.length === 0) {
      podiumEl.innerHTML  = '';
      titleEl.style.display = 'none';
      return;
    }
    titleEl.style.display = '';

    var medals = ['🥇', '🥈', '🥉'];
    var visualOrder = [1, 0, 2]; // 2nd, 1st, 3rd — classic podium arrangement

    podiumEl.innerHTML = visualOrder
      .filter(function(i) { return top3[i]; })
      .map(function(i) {
        var entry = top3[i];
        var mine  = entry.sessionId === SESSION_ID;
        return '<div class="podium-col rank-' + (i + 1) + (mine ? ' me' : '') + '">' +
          '<span class="podium-medal">' + medals[i] + '</span>' +
          '<span class="podium-name">' + escapeHtml(entry.result.name) + '</span>' +
          '<span class="podium-score">' + entry.result.score + '/' + entry.result.total + '</span>' +
          '<div class="podium-bar"></div>' +
          '</div>';
      }).join('');
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  document.title = QUIZ.title || 'Sentence Ordering';
  document.getElementById('quiz-title').textContent = QUIZ.title || '';

  function startGame() {
    var name = document.getElementById('name-input').value.trim();
    if (!name) return;
    studentName = name;
    document.getElementById('name-entry').className = 'name-entry hide';
    document.getElementById('game').style.display = '';
    render();
  }

  function render() {
    var q = questions[idx];

    answered = false;
    placed   = [];
    bank     = shuffle(q.sentence.map(function(word, origIndex) { return { word: word, origIndex: origIndex }; }));

    document.getElementById('counter').textContent  = 'Sentence ' + (idx + 1) + ' of ' + total;
    document.getElementById('progress').style.width = (idx / total * 100) + '%';
    document.getElementById('explanation-wrap').className = 'explanation-wrap';
    document.getElementById('explanation-text').textContent = '';
    document.getElementById('next-btn').className = 'next-btn';

    renderBank();
    renderAnswerRow();
    updateCheckButton();
  }

  function renderBank() {
    var el = document.getElementById('word-bank');
    el.innerHTML = '';
    bank.forEach(function(chip, bankPos) {
      var btn = document.createElement('button');
      btn.className   = 'word-chip';
      btn.textContent = chip.word;
      btn.onclick = function() { placeWord(bankPos); };
      el.appendChild(btn);
    });
  }

  function renderAnswerRow() {
    var el = document.getElementById('answer-row');
    el.className = 'answer-row' + (placed.length === 0 ? ' empty' : '');
    el.innerHTML = '';
    placed.forEach(function(chip, placedPos) {
      var btn = document.createElement('button');
      btn.className   = 'word-chip placed';
      btn.textContent = chip.word;
      btn.onclick = function() { unplaceWord(placedPos); };
      el.appendChild(btn);
    });
  }

  function placeWord(bankPos) {
    if (answered) return;
    var chip = bank.splice(bankPos, 1)[0];
    placed.push(chip);
    renderBank();
    renderAnswerRow();
    updateCheckButton();
  }

  function unplaceWord(placedPos) {
    if (answered) return;
    var chip = placed.splice(placedPos, 1)[0];
    bank.push(chip);
    renderBank();
    renderAnswerRow();
    updateCheckButton();
  }

  function updateCheckButton() {
    var q = questions[idx];
    document.getElementById('check-btn').disabled = placed.length !== q.sentence.length;
  }

  function checkAnswer() {
    var q       = questions[idx];
    var answer  = placed.map(function(chip) { return chip.word; });
    var correct = answer.length === q.sentence.length && answer.every(function(w, i) { return w === q.sentence[i]; });

    answered = true;
    document.querySelectorAll('.word-chip').forEach(function(el) { el.classList.add('disabled'); });
    document.getElementById('check-btn').style.display = 'none';

    var row = document.getElementById('answer-row');
    if (correct) {
      score++;
      row.classList.add('correct');
    } else {
      row.classList.add('wrong');
      var explanation = 'Correct order: ' + q.sentence.join(' ') + (q.hint ? '\n' + q.hint : '');
      document.getElementById('explanation-text').textContent = explanation;
      document.getElementById('explanation-wrap').className   = 'explanation-wrap show';
    }

    document.getElementById('next-btn').className = 'next-btn show';
  }

  function next() {
    document.getElementById('check-btn').style.display = '';
    idx++;
    if (idx < total) { render(); } else { showResults(); }
  }

  function showResults() {
    document.getElementById('game').style.display   = 'none';
    document.getElementById('progress').style.width = '100%';

    var pct = Math.round(score / total * 100);
    document.getElementById('results-score').textContent = pct + '%';
    document.getElementById('results-sub').textContent   = score + ' out of ' + total + ' correct';

    var emoji, label;
    if      (pct === 100) { emoji = '🏆'; label = 'Perfect score!';    }
    else if (pct >= 80)   { emoji = '🎉'; label = 'Excellent work!';   }
    else if (pct >= 60)   { emoji = '👍'; label = 'Good job!';         }
    else if (pct >= 40)   { emoji = '📚'; label = 'Keep practicing!';  }
    else                  { emoji = '💪'; label = "Don't give up!";     }

    document.getElementById('results-emoji').textContent = emoji;
    document.getElementById('results-label').textContent = label;
    document.getElementById('results').className         = 'results show';

    leaderboard[SESSION_ID] = { name: studentName, score: score, total: total };
    renderLeaderboard();
  }

  function restart() {
    idx   = 0;
    score = 0;
    document.getElementById('check-btn').style.display = '';
    document.getElementById('game').style.display = '';
    document.getElementById('results').className  = 'results';
    render();
  }
</script>
</body>
</html>
